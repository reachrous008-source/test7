<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Prime Kits Premium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <div id="page-loader">
    <div class="loader-logo">PRIME KITS</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
  </div>

  <!-- Navbar -->
  <nav id="navbar">
    <a href="index.html" class="nav-logo"><span class="crown-icon">♛</span> PRIME KITS</a>
    <ul class="nav-links">
      <li><a href="index.html#featured">Shop</a></li>
      <li><a href="index.html#new-arrivals">New Arrivals</a></li>
      <li><a href="index.html#trending">Trending</a></li>
      <li><a href="index.html#sale">Sale</a></li>
    </ul>
    <div class="nav-actions">
      <button class="nav-icon-btn" id="search-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="nav-icon-btn" onclick="toggleCart()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count" style="display:none">0</span>
      </button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobile-menu">
    <button id="mobile-close" class="mobile-close">✕</button>
    <a href="index.html#featured">Shop</a>
    <a href="index.html#new-arrivals">New Arrivals</a>
    <a href="index.html#trending">Trending</a>
  </div>

  <!-- Search -->
  <div id="search-overlay">
    <button id="search-close" class="search-close">✕</button>
    <input id="search-input" type="text" placeholder="Search products…">
    <div id="search-results"></div>
  </div>

  <!-- Cart Drawer -->
  <div id="cart-overlay" onclick="toggleCart()"></div>
  <aside id="cart-drawer">
    <div class="cart-header">
      <h2>♛ Your Cart</h2>
      <button class="cart-close" onclick="toggleCart()">✕</button>
    </div>
    <div id="cart-items-list">
      <div id="cart-empty"><div class="empty-icon">♛</div><p>Your cart is empty</p></div>
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="btn-gold btn-full" onclick="goToCheckout()"><span>Checkout</span></button>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════
       PRODUCT DETAIL
  ═══════════════════════════════════════════ -->
  <main style="padding-top:100px;min-height:70vh">
    <div class="container" style="padding:3rem 2rem">

      <!-- Breadcrumb -->
      <nav style="margin-bottom:2.5rem;font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.15em;color:var(--white-muted)">
        <a href="index.html" style="color:var(--white-muted);transition:color 0.3s">Home</a>
        <span style="margin:0 0.5rem;color:var(--border)">→</span>
        <span id="product-category-breadcrumb">Product</span>
        <span style="margin:0 0.5rem;color:var(--border)">→</span>
        <span id="product-title-breadcrumb" style="color:var(--gold)">Loading…</span>
      </nav>

      <!-- Skeleton while loading -->
      <div id="product-skeleton" style="display:grid;grid-template-columns:1fr 1fr;gap:3rem">
        <div class="skeleton" style="height:600px"></div>
        <div style="display:flex;flex-direction:column;gap:1rem">
          <div class="skeleton" style="height:40px;width:70%"></div>
          <div class="skeleton" style="height:24px;width:40%"></div>
          <div class="skeleton" style="height:120px"></div>
          <div class="skeleton" style="height:50px"></div>
          <div class="skeleton" style="height:56px"></div>
        </div>
      </div>

      <!-- Product Content (hidden until loaded) -->
      <div id="product-content" style="display:none">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start">

          <!-- Gallery -->
          <div>
            <div class="product-gallery">
              <div class="product-thumbnails" id="thumbnails"></div>
              <div class="product-main-img" id="main-img-wrap">
                <img id="main-img" src="" alt="Product">
              </div>
            </div>
          </div>

          <!-- Info -->
          <div class="product-info" style="padding:0">
            <div style="margin-bottom:0.75rem">
              <span id="product-category-tag" style="font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)"></span>
            </div>
            <h1 class="product-title" id="product-title">Loading…</h1>

            <!-- Pricing -->
            <div class="product-pricing" style="margin:1rem 0 1.5rem">
              <span class="product-price" id="product-price" style="font-size:1.6rem"></span>
              <span class="product-old-price" id="product-old-price"></span>
              <span class="product-sale-pct" id="product-sale-pct"></span>
            </div>

            <!-- Stock -->
            <div style="margin-bottom:1.5rem">
              <div class="stock-badge" id="stock-badge">
                <div class="stock-dot"></div>
                <span></span>
              </div>
            </div>

            <!-- Description -->
            <p class="product-desc" id="product-desc"></p>

            <div style="height:1px;background:var(--border);margin:1.5rem 0"></div>

            <!-- Size -->
            <div style="margin-bottom:1.5rem">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
                <label style="font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--white-muted)">Select Size</label>
                <a href="#" style="font-family:var(--font-ui);font-size:0.65rem;color:var(--gold);text-decoration:underline">Size Guide</a>
              </div>
              <div class="size-grid" id="size-grid"></div>
            </div>

            <!-- Quantity -->
            <div style="margin-bottom:2rem">
              <label style="font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--white-muted);display:block;margin-bottom:0.75rem">Quantity</label>
              <div class="qty-row">
                <div class="qty-control">
                  <button onclick="changeQty(-1)">−</button>
                  <input type="number" id="qty-input" value="1" min="1" max="10">
                  <button onclick="changeQty(1)">+</button>
                </div>
              </div>
            </div>

            <!-- CTA Buttons -->
            <div style="display:flex;flex-direction:column;gap:0.75rem">
              <button class="btn-gold btn-full" id="add-to-cart-btn" onclick="handleAddToCart()">
                <span>Add to Cart</span>
              </button>
              <button class="btn-outline btn-full" onclick="handleBuyNow()">Buy Now</button>
            </div>

            <div style="height:1px;background:var(--border);margin:2rem 0"></div>

            <!-- Tags -->
            <div id="product-tags" style="display:flex;gap:0.5rem;flex-wrap:wrap"></div>
          </div>
        </div>
      </div>

      <!-- Related Products -->
      <section style="margin-top:6rem">
        <div style="text-align:center;margin-bottom:3rem">
          <p class="section-label">You May Also Like</p>
          <h2 class="section-title">Related <span>Products</span></h2>
        </div>
        <div id="related-grid" class="products-grid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Prime Kits Premium. All rights reserved.</p>
        <p>♛ EST. 2026</p>
      </div>
    </div>
  </footer>

  <script>
    function changeQty(delta) {
      const input = document.getElementById('qty-input');
      input.value = Math.max(1, Math.min(10, parseInt(input.value) + delta));
    }

    let currentProduct = null;
    let selectedSize = null;

    function handleAddToCart() {
      if (!selectedSize) { showToast('Please select a size', 'error'); return; }
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      for(let i = 0; i < qty; i++) addToCart(currentProduct, selectedSize);
    }

    function handleBuyNow() {
      if (!selectedSize) { showToast('Please select a size', 'error'); return; }
      handleAddToCart();
      setTimeout(goToCheckout, 300);
    }
  </script>

  <script type="module">
    import { db, collection, getDocs, query, limit, doc, getDoc } from './firebase-config.js';

    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('page-loader')?.classList.add('hidden'), 1800);
    });

    const params = new URLSearchParams(location.search);
    const productId = params.get('id');

    if (!productId) { window.location.href = 'index.html'; }

    async function loadProduct() {
      try {
        const snap = await getDocs(collection(db, 'products'));
        const docData = snap.docs.find(d => d.id === productId);
        if (!docData) { window.location.href = 'index.html'; return; }

        const p = { id: docData.id, ...docData.data() };
        currentProduct = p;

        // Hide skeleton
        document.getElementById('product-skeleton').style.display = 'none';
        document.getElementById('product-content').style.display = '';

        // Breadcrumb
        document.getElementById('product-title-breadcrumb').textContent = p.title;
        document.getElementById('product-category-breadcrumb').textContent = p.category || 'Products';
        document.title = `${p.title} — Prime Kits Premium`;

        // Main image
        const mainImg = document.getElementById('main-img');
        mainImg.src = p.images?.[0] || 'assets/placeholder.jpg';
        mainImg.alt = p.title;

        // Thumbnails
        const thumbsEl = document.getElementById('thumbnails');
        thumbsEl.innerHTML = (p.images || [p.images?.[0]]).map((img, i) => `
          <div class="product-thumb ${i === 0 ? 'active' : ''}" onclick="switchImage('${img}', this)">
            <img src="${img}" alt="View ${i+1}">
          </div>`).join('');

        // Title, category, description
        document.getElementById('product-title').textContent = p.title;
        document.getElementById('product-category-tag').textContent = p.category || '';
        document.getElementById('product-desc').textContent = p.description || '';

        // Pricing
        document.getElementById('product-price').textContent = `$${p.price?.toFixed(2)}`;
        if (p.oldPrice) {
          document.getElementById('product-old-price').textContent = `$${p.oldPrice.toFixed(2)}`;
          const pct = Math.round((1 - p.price / p.oldPrice) * 100);
          document.getElementById('product-sale-pct').textContent = `-${pct}%`;
        }

        // Stock
        const stockBadge = document.getElementById('stock-badge');
        const dot = stockBadge.querySelector('.stock-dot');
        const label = stockBadge.querySelector('span');
        if (p.stock <= 0) { dot.className = 'stock-dot out'; label.textContent = 'Out of Stock'; }
        else if (p.stock < 5) { dot.className = 'stock-dot low'; label.textContent = `Only ${p.stock} left!`; }
        else { label.textContent = 'In Stock'; }

        // Sizes
        const sizeGrid = document.getElementById('size-grid');
        sizeGrid.innerHTML = (p.sizes || ['S','M','L','XL']).map(s => `
          <button class="size-option" data-size="${s}" onclick="selectSize('${s}', this)">${s}</button>`).join('');

        // Tags
        const tagsEl = document.getElementById('product-tags');
        tagsEl.innerHTML = (p.tags || []).map(t =>
          `<span style="border:1px solid var(--border);padding:0.25rem 0.7rem;font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.1em;color:var(--white-muted)">${t}</span>`
        ).join('');

        // Related products
        loadRelated(p.category, p.id);

      } catch (err) {
        console.error(err);
        showToast('Error loading product', 'error');
      }
    }

    async function loadRelated(category, excludeId) {
      const snap = await getDocs(query(collection(db, 'products'), limit(8)));
      const related = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(p => p.id !== excludeId && p.category === category)
        .slice(0, 4);

      if (!related.length) return;

      document.getElementById('related-grid').innerHTML = related.map(p => `
        <div class="product-card">
          <div class="product-card-img">
            <img src="${p.images?.[0] || 'assets/placeholder.jpg'}" alt="${p.title}" loading="lazy">
          </div>
          <div class="product-card-body">
            <h3><a href="product.html?id=${p.id}">${p.title}</a></h3>
            <div class="product-pricing">
              <span class="product-price">$${p.price?.toFixed(2)}</span>
            </div>
          </div>
        </div>`).join('');
    }

    window.switchImage = (src, el) => {
      document.getElementById('main-img').src = src;
      document.querySelectorAll('.product-thumb').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    };

    window.selectSize = (size, el) => {
      selectedSize = size;
      document.querySelectorAll('.size-option').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    };

    // Cursor
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; if(cursor){cursor.style.left=mx+'px';cursor.style.top=my+'px';}});
    function animRing(){if(ring){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';}requestAnimationFrame(animRing);}
    animRing();

    // Navbar
    window.addEventListener('scroll', () => document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 60));
    document.getElementById('hamburger')?.addEventListener('click', () => { document.getElementById('mobile-menu')?.classList.add('open'); });
    document.getElementById('mobile-close')?.addEventListener('click', () => { document.getElementById('mobile-menu')?.classList.remove('open'); });
    document.getElementById('search-btn')?.addEventListener('click', () => document.getElementById('search-overlay')?.classList.add('open'));
    document.getElementById('search-close')?.addEventListener('click', () => document.getElementById('search-overlay')?.classList.remove('open'));

    loadProduct();
  </script>

  <script type="module" src="cart.js"></script>
</body>
</html>
